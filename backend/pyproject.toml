[project]
name = "jev-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[tool.uv]
exclude-newer = "7 days"
no-build = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]
